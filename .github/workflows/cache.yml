name: Cache segments (MEGA)

on:
  workflow_dispatch:

jobs:
  cache-segments:
    runs-on: ubuntu-22.04

    steps:
    # ----------------------------------------
    # Install tools
    # ----------------------------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y unzip megatools

    # ----------------------------------------
    # Cache segments
    # ----------------------------------------
    - name: Restore Segments cache
      uses: actions/cache@v4
      with:
        path: segments
        key: classd-${{ runner.os }}

    # ----------------------------------------
    # Download if cache miss
    # ----------------------------------------
    - name: Download segments (if needed)
      run: |
        if [ ! -d segments ]; then
          echo "📥 Cache miss → downloading segments"

          mkdir -p segments_zip

          megadl "https://mega.nz/file/A2lUiToY#KI9I0NjYaUalC2k9F4Go1jRwgqI8GC8rV9ZQaG9AUk0" \
            --path segments_zip

          mkdir -p segments
          unzip -o segments_zip/*.zip -d segments

        else
          echo "✅ segments restored from cache"
        fi
