name: VTM Encode First 32 Frames (4 Videos × 4 QPs)

on:
  workflow_dispatch:

jobs:
  encode:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        VIDEO_ID:
          - BasketballDrill_832x480_50
          - BQMall_832x480_60
          - PartyScene_832x480_50
          - RaceHorses_832x480_30
        QP: [37, 42, 47, 51]

    env:
      GOP: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore VTM binary
        uses: actions/cache@v4
        with:
          path: VTM/bin
          key: vtm-20.2-v1-Linux

      - name: Restore YUV segments
        uses: actions/cache@v4
        with:
          path: segments
          key: classd-Linux

      - name: Locate EncoderApp
        run: |
          ENCODER=$(find VTM/bin -type f \( -name "EncoderAppStatic*" -o -name "EncoderApp*" \) | head -n1)

          [ -z "$ENCODER" ] && { echo "EncoderApp not found"; exit 1; }

          chmod +x "$ENCODER"
          echo "ENCODER=$ENCODER" >> "$GITHUB_ENV"

      - name: Set video parameters
        run: |
          VIDEO_ID="${{ matrix.VIDEO_ID }}"

          case "$VIDEO_ID" in
            BasketballDrill_832x480_50|PartyScene_832x480_50)
              echo "WIDTH=832" >> "$GITHUB_ENV"
              echo "HEIGHT=480" >> "$GITHUB_ENV"
              echo "FPS=50" >> "$GITHUB_ENV"
              ;;

            BQMall_832x480_60)
              echo "WIDTH=832" >> "$GITHUB_ENV"
              echo "HEIGHT=480" >> "$GITHUB_ENV"
              echo "FPS=60" >> "$GITHUB_ENV"
              ;;

            RaceHorses_832x480_30)
              echo "WIDTH=832" >> "$GITHUB_ENV"
              echo "HEIGHT=480" >> "$GITHUB_ENV"
              echo "FPS=30" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unknown VIDEO_ID: $VIDEO_ID"
              exit 1
              ;;
          esac

      - name: Encode first 32 frames
        run: |
          set -e

          VIDEO_ID="${{ matrix.VIDEO_ID }}"
          QP="${{ matrix.QP }}"

          CFG="cfg/experimental/encoder_lowdelay_P_vtm_FixedQP_GOP_8.cfg"
          INPUT="segments/Class C/${VIDEO_ID}.yuv"

          [ ! -f "$INPUT" ] && { echo "Missing input file: $INPUT"; exit 1; }

          OUTDIR="encoded_ac"
          mkdir -p "$OUTDIR"

          "$ENCODER" \
            -c "$CFG" \
            -i "$INPUT" \
            -b "$OUTDIR/B_${VIDEO_ID}_QP_${QP}_F_1_to_32.bin" \
            -o "$OUTDIR/C_${VIDEO_ID}_QP_${QP}_F_1_to_32.yuv" \
            -wdt "$WIDTH" \
            -hgt "$HEIGHT" \
            -fr "$FPS" \
            -f 32 \
            -q "$QP" \
            > "$OUTDIR/encode.log" 2>&1

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: |
          rclone copy \
            encoded_ac \
            "dataset:Testing_ClassC/${{ matrix.VIDEO_ID }}/QP_${{ matrix.QP }}" \
            --progress
